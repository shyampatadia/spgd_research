# Experiment 2 — Two Moons MLP visual saddle analysis
# 5 optimizers x 5 seeds = 25 full-batch training runs.
# Seed 0 of each optimizer additionally records its weight trajectory for
# the PCA loss-landscape figure.

n_seeds: 5
n_steps: 2000
n_samples: 1000
noise: 0.2
test_frac: 0.2

hidden: 32
n_hidden: 2

# Stagnation: ||grad||_2 below this counts as stagnant. We use the proposal's
# stricter threshold of 1e-4 for Two Moons (Exp 1 also uses 1e-4 on smooth
# benchmarks); a stricter threshold can only reduce stagnation counts vs 1e-3,
# so this is the more conservative claim.
stagnation_eps: 1.0e-4

# Weight history sampled every k steps (only for seed 0 of each optimizer).
# 2000 / 10 = 200 snapshots, ~1185 params -> ~240k floats per optimizer (small).
weights_snapshot_every: 10

# Hyperparameters tuned for full-batch BCE-with-logits on Two Moons.
# All four gradient-based optimizers share lr; Adam gets a smaller lr because
# Adam normalizes per-parameter gradient stats internally.
optimizers:
  sgd:
    lr: 5.0e-2
  adam:
    lr: 1.0e-2
  pgd:
    lr: 5.0e-2
    amp: 0.05      # ~1/3 of typical weight magnitude at init (Kaiming)
    iter_p: 50     # perturbation every 50 steps -> ~40 phases per run
  rpgd:
    lr: 5.0e-2
    amp: 0.05
    n_p: 10
    iter_p: 50
  spgd:
    lr: 5.0e-2
    amp: 0.05
    n_p: 10
    iter_p: 50
